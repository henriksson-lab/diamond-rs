name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  native:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - platform: macOS ARM64
            os: macos-latest
            host: aarch64-apple-darwin
          - platform: macOS Intel
            os: macos-15-intel
            host: x86_64-apple-darwin
          - platform: Windows x86-64
            os: windows-latest
            host: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Select Rust
        run: rustup default stable

      - name: Verify native compiler host
        env:
          EXPECTED_RUST_HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"

      - name: Check spill calibration control flow
        run: bash scripts/tests/spill_calibration.sh

      # Test the packaged crate on each host instead of testing the same code
      # again from the checkout. No adjacent C++ tree may be required.
      - name: Package and verify the crate
        run: |
          cargo package --locked
          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'diamond-rs-*' -print -quit)"
          test -n "$package_dir"
          test ! -e "$package_dir/diamond"
          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Test default features
        run: |
          # Source-compatible CRT files are inheritable. A subprocess test must
          # not inherit files held by a concurrent in-process library test.
          # This controls the harness; application thread-count tests still run.
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RUST_TEST_THREADS=1
          fi
          cargo test --locked --all-targets --manifest-path "$PACKAGE_DIR/Cargo.toml"

      # Run the optional suite once; the following build checks every feature
      # on all four native hosts, including both Apple architectures.
      - name: Test optional native features
        if: matrix.platform == 'Linux x86-64'
        run: cargo test --locked --all-targets --features dna,mcl,zstd --manifest-path "$PACKAGE_DIR/Cargo.toml"

      - name: Build all features without the C++ tree
        run: cargo build --locked --all-targets --all-features --manifest-path "$PACKAGE_DIR/Cargo.toml"

      - name: Build release executable
        run: cargo build --locked --release --bin diamond --manifest-path "$PACKAGE_DIR/Cargo.toml"

      - name: Calibrate and test delayed spilling
        id: spill
        run: scripts/run_native_spill_conformance.sh target/native-spill-conformance

      - name: Upload spill decision evidence
        if: always() && (steps.spill.outcome == 'success' || steps.spill.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: native-spill-conformance-${{ matrix.os }}
          path: target/native-spill-conformance
          if-no-files-found: error
          retention-days: 90

  linux-musl:
    name: Test (Linux x86-64 musl)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install Rust with musl target
        run: rustup toolchain install stable --profile minimal --no-self-update --target x86_64-unknown-linux-musl

      - name: Select Rust
        run: rustup default stable

      # Execute the resulting static musl test binaries on the Ubuntu runner.
      # Keep the optional C++ oracle out of this portable production build.
      - name: Test
        run: cargo test --locked --target x86_64-unknown-linux-musl --all-targets

      - name: Build release executable for spill conformance
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin diamond

      - name: Calibrate and test delayed spilling with musl
        id: musl_spill
        env:
          DIAMOND_BIN: target/x86_64-unknown-linux-musl/release/diamond
        run: scripts/run_native_spill_conformance.sh target/native-spill-conformance-linux-musl

      - name: Upload musl spill decision evidence
        if: always() && (steps.musl_spill.outcome == 'success' || steps.musl_spill.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: native-spill-conformance-linux-musl
          path: target/native-spill-conformance-linux-musl
          if-no-files-found: error
          retention-days: 90

  linux-32-bit:
    name: Check (Linux i686 GNU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib

      - name: Install Rust with i686 target
        run: rustup toolchain install stable --profile minimal --no-self-update --target i686-unknown-linux-gnu

      - name: Select Rust
        run: rustup default stable

      - name: Check
        run: cargo check --locked --target i686-unknown-linux-gnu --all-targets

  windows-32-bit:
    name: Check (Windows i686 MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure x86 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Rust with i686 target
        run: rustup toolchain install stable --profile minimal --no-self-update --target i686-pc-windows-msvc

      - name: Select Rust
        run: rustup default stable

      - name: Check
        run: cargo check --locked --target i686-pc-windows-msvc --all-targets
