name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The package matrix builds several profiles and integration executables on
# hosted runners with limited disk space. Keep test assertions and behavior,
# while avoiding duplicate debug-symbol and incremental-codegen artifacts.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: Verify packaged crate (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - platform: macOS ARM64
            os: macos-latest
            host: aarch64-apple-darwin
          - platform: macOS Intel
            os: macos-15-intel
            host: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Select Rust
        run: rustup default stable

      # Check the native host explicitly so a runner-label change cannot
      # silently drop either Apple architecture from package validation.
      - name: Verify native compiler host
        shell: bash
        env:
          EXPECTED_RUST_HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          cargo -V
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"

      # Build from Cargo's isolated package staging directory. This catches
      # accidental compile-time dependencies on checkout-only files (notably
      # the adjacent upstream C++ tree) that an ordinary workspace build can
      # hide.
      - name: Verify package contents build independently
        run: cargo package --locked

      - name: Test the isolated package contents
        shell: bash
        run: |
          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'diamond-rs-*' -print -quit)"
          test -n "$package_dir"
          cargo test --locked --all-targets --manifest-path "$package_dir/Cargo.toml"

      # Execute optional native workflows on each package host as well as
      # compiling them. Keep the diagnostic C++ bridge out of this test run.
      - name: Test optional native features in the isolated package
        shell: bash
        run: |
          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'diamond-rs-*' -print -quit)"
          test -n "$package_dir"
          cargo test --locked --all-targets --features dna,mcl,zstd --manifest-path "$package_dir/Cargo.toml"

      # The published package omits diamond/. Even with ffi requested, it
      # must compile on both Apple architectures without the C++ source tree.
      - name: Build the isolated package with all features
        shell: bash
        run: |
          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'diamond-rs-*' -print -quit)"
          test -n "$package_dir"
          test ! -e "$package_dir/diamond"
          cargo build --locked --all-targets --all-features --manifest-path "$package_dir/Cargo.toml"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # macos-latest is the GitHub-hosted arm64 image. Keep an explicit
          # Intel runner as well: RSS/Mach bindings and the target C runtime
          # must be exercised natively on both supported architectures.
          - macos-latest
          - macos-15-intel
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Select Rust
        run: rustup default stable

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

  native-spill-conformance:
    name: Native delayed spill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Select Rust
        run: rustup default stable

      - name: Build release executable
        run: cargo build --locked --release --bin diamond

      # Git for Windows supplies the same bash/awk/coreutils surface used on
      # Linux and macOS. The driver calibrates from target-native RSS behavior;
      # it does not reuse a threshold measured on another runner.
      - name: Calibrate and test delayed spilling
        shell: bash
        run: scripts/run_native_spill_conformance.sh target/native-spill-conformance

      - name: Upload spill decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-spill-conformance-${{ matrix.os }}
          path: target/native-spill-conformance
          if-no-files-found: error
          retention-days: 90

  linux-musl:
    name: Test (Linux x86-64 musl)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install Rust with musl target
        run: rustup toolchain install stable --profile minimal --no-self-update --target x86_64-unknown-linux-musl

      - name: Select Rust
        run: rustup default stable

      # Execute the resulting static musl test binaries on the Ubuntu runner.
      # Keep the optional C++ oracle out of this portable production build.
      - name: Test
        run: cargo test --locked --target x86_64-unknown-linux-musl --all-targets

      - name: Build release executable for spill conformance
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin diamond

      - name: Calibrate and test delayed spilling with musl
        id: musl_spill
        env:
          DIAMOND_BIN: target/x86_64-unknown-linux-musl/release/diamond
        run: scripts/run_native_spill_conformance.sh target/native-spill-conformance-linux-musl

      - name: Upload musl spill decision evidence
        if: always() && (steps.musl_spill.outcome == 'success' || steps.musl_spill.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: native-spill-conformance-linux-musl
          path: target/native-spill-conformance-linux-musl
          if-no-files-found: error
          retention-days: 90

  linux-32-bit:
    name: Check (Linux i686 GNU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Install 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib

      - name: Install Rust with i686 target
        run: rustup toolchain install stable --profile minimal --no-self-update --target i686-unknown-linux-gnu

      - name: Select Rust
        run: rustup default stable

      - name: Check
        run: cargo check --locked --target i686-unknown-linux-gnu --all-targets

  windows-32-bit:
    name: Check (Windows i686 MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Configure x86 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Rust with i686 target
        run: rustup toolchain install stable --profile minimal --no-self-update --target i686-pc-windows-msvc

      - name: Select Rust
        run: rustup default stable

      - name: Check
        run: cargo check --locked --target i686-pc-windows-msvc --all-targets
