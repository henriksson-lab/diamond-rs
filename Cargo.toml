[package]
name = "diamond-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of the DIAMOND protein sequence aligner"
license = "Apache-2.0"

[lib]
name = "diamond"
path = "src/lib.rs"

[[bin]]
name = "diamond"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", features = ["zlib-rs"] }
nalgebra = "0.32.6"
rayon = "1"
zstd = "0.13"

[features]
default = []
ffi = ["dep:cmake"]

[build-dependencies]
cmake = { version = "0.1", optional = true }
